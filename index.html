<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RL Trade Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <h1>RL Trade Hub</h1>
        <button id="newPostBtn">New Post</button>
    </nav>

    <main id="tradeFeed">
        <div class="post-card">
            <p>Example: Trading Titanium White Octane</p>
            <span class="rank-tag">GC</span>
        </div>
    </main>

    <div id="postModal" class="modal">
        <div class="modal-content">
            <h2>Create New Trade</h2>
            <form id="tradeForm">
                <label>Year of Creation:</label>
                <input type="number" id="year" min="2015" max="2026" value="2026">

                <label>Your Rank:</label>
                <div class="rank-selector">
                    <label><input type="radio" name="rank" value="Bronze" required> <img src="https://path-to-icons/bronze.png" alt="Bronze"> Bronze</label>
                    <label><input type="radio" name="rank" value="Champion"> <img src="https://path-to-icons/champ.png" alt="C"> Champion</label>
                    <label><input type="radio" name="rank" value="Grand Champion"> <img src="https://path-to-icons/gc.png" alt="GC"> GC</label>
                </div>

                <button type="submit">Publish</button>
                <button type="button" id="closeBtn">Cancel</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
