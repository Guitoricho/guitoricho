<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexCord | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        body { background-color: #1a1a1a; color: white; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <nav class="w-20 bg-[#121212] flex flex-col items-center py-4 gap-4 border-r border-white/10">
        <div class="w-12 h-12 bg-blue-600 rounded-2xl flex items-center justify-center font-bold cursor-pointer hover:rounded-xl transition-all">N</div>
        <hr class="w-8 border-white/10">
        <div class="w-12 h-12 glass rounded-3xl flex items-center justify-center cursor-pointer hover:rounded-xl transition-all hover:bg-blue-500">+</div>
    </nav>

    <aside class="w-64 bg-[#181818] flex flex-col">
        <div class="p-4 shadow-md font-bold border-b border-white/10">NexCord</div>
        <div class="flex-1 p-2 space-y-1 overflow-y-auto" id="friend-list">
            <p class="text-xs font-semibold text-gray-500 uppercase px-2 py-2">Amis en ligne</p>
            <div class="flex items-center gap-3 p-2 hover:bg-white/5 rounded cursor-pointer group">
                <div class="relative">
                    <div class="w-8 h-8 bg-gray-600 rounded-full"></div>
                    <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-[#181818] rounded-full"></div>
                </div>
                <span class="text-gray-300 group-hover:text-white">Ami_Alpha</span>
            </div>
        </div>
        
        <div class="p-3 bg-[#131313] flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-blue-500 rounded-full" id="user-avatar"></div>
                <div>
                    <p class="text-xs font-bold" id="username-display">Utilisateur</p>
                    <p class="text-[10px] text-gray-400">#0001</p>
                </div>
            </div>
            <button onclick="openSettings()" class="text-gray-400 hover:text-white">⚙️</button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col bg-[#202020]">
        <header class="h-12 border-b border-white/10 flex items-center px-4 shadow-sm">
            <span class="text-gray-400 mr-2">#</span> 
            <span class="font-bold">général</span>
        </header>
        
        <div class="flex-1 overflow-y-auto p-4 space-y-4" id="chat-messages">
            </div>

        <div class="p-4">
            <input type="text" id="chat-input" placeholder="Envoyer un message dans #général" 
                   class="w-full bg-[#2b2b2b] p-3 rounded-lg outline-none focus:ring-1 ring-blue-500 transition-all">
        </div>
    </main>

</body>
</html>
