<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RL Trade Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <div class="logo">RL Trade Hub</div>
        <button id="newPostBtn">New Post</button>
    </nav>

    <div class="container">
        <div id="tradeFeed">
            <div class="post-card">
                <div class="post-info">
                    <h3>Trading Titanium White Octane</h3>
                    <p>Created: 2026</p>
                </div>
                <div class="post-rank">
                    <img src="https://static.wikia.nocookie.net/rocketleague/images/d/d2/Grand_champion1_rank_icon.png" alt="GC">
                    <span>Grand Champion</span>
                </div>
            </div>
        </div>
    </div>

    <div id="postModal" class="modal">
        <div class="modal-content">
            <h2>New Trade Post</h2>
            <form id="tradeForm">
                <label>Trade Title</label>
                <input type="text" id="title" placeholder="H: Credits W: Fennec" required>

                <label>Year of Account Creation</label>
                <input type="number" id="year" value="2026" min="2015" max="2026">

                <label>Your Rank</label>
                <select id="rankSelect">
                    <option value="Bronze" data-icon="https://static.wikia.nocookie.net/rocketleague/images/0/00/Bronze1_rank_icon.png">Bronze</option>
                    <option value="Silver" data-icon="https://static.wikia.nocookie.net/rocketleague/images/d/d3/Silver1_rank_icon.png">Silver</option>
                    <option value="Gold" data-icon="https://static.wikia.nocookie.net/rocketleague/images/9/90/Gold1_rank_icon.png">Gold</option>
                    <option value="Platinum" data-icon="https://static.wikia.nocookie.net/rocketleague/images/d/d4/Platinum1_rank_icon.png">Platinum</option>
                    <option value="Diamond" data-icon="https://static.wikia.nocookie.net/rocketleague/images/0/0d/Diamond1_rank_icon.png">Diamond</option>
                    <option value="Champion" data-icon="https://static.wikia.nocookie.net/rocketleague/images/c/c5/Champion1_rank_icon.png">Champion</option>
                    <option value="Grand Champion" data-icon="https://static.wikia.nocookie.net/rocketleague/images/d/d2/Grand_champion1_rank_icon.png">Grand Champion</option>
                    <option value="SSL" data-icon="https://static.wikia.nocookie.net/rocketleague/images/3/30/Supersonic_Legend_rank_icon.png">SSL</option>
                </select>

                <div class="modal-footer">
                    <button type="submit" class="submit-btn">Publish</button>
                    <button type="button" id="closeBtn" class="cancel-btn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
