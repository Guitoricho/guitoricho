    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Outfit:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #050505; 
            --accent: #ff3e3e; 
            --text: #ffffff; 
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --discord: #5865F2;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Space Grotesk', sans-serif; 
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 50%, #0a0a0a 0%, #050505 100%);
        }

        /* --- BACKGROUND GRID --- */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: -1;
            mask-image: radial-gradient(ellipse at center, black, transparent 90%);
            opacity: 0.2;
        }

        /* --- HERO --- */
        .hero-showcase {
            width: 100%; height: 55vh;
            background: url('https://image.noelshack.com/fichiers/2026/15/2/1775586818-spoiler-screenshot-83.png') no-repeat center center;
            background-size: cover; position: relative;
            mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
        }

        header { 
            height: 35vh; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; text-align: center;
            margin-top: -8vh;
        }
        h1 { 
            font-family: 'Outfit', sans-serif; font-size: clamp(3.5rem, 12vw, 8.5rem); 
            font-weight: 900; text-transform: uppercase; letter-spacing: -6px; 
            color: #fff; line-height: 0.8; margin-bottom: 10px;
        }
        .subtitle { 
            font-size: 0.9rem; letter-spacing: 8px; text-transform: uppercase; 
            color: var(--accent); font-weight: 700; margin-bottom: 35px;
        }

        /* --- CONTACT BUTTONS --- */
        .contact-wrap { display: flex; gap: 20px; }
        .btn {
            display: flex; align-items: center; gap: 12px;
            padding: 14px 28px; border-radius: 12px;
            background: var(--glass); border: 1px solid var(--border);
            color: white; text-decoration: none; font-weight: 600;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            backdrop-filter: blur(15px); font-size: 0.9rem;
        }
        .btn:hover { 
            background: rgba(255,255,255,0.08); 
            transform: translateY(-5px); 
            border-color: rgba(255,255,255,0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* BETTER ROBLOX ICON STYLE */
        .btn-roblox:hover { border-color: var(--accent); box-shadow: 0 0 20px rgba(255, 62, 62, 0.2); }
        .btn-roblox svg { fill: #fff; width: 20px; height: 20px; transform: rotate(-10deg); }
        .btn-roblox:hover svg { fill: var(--accent); transform: rotate(0deg) scale(1.1); transition: 0.3s; }

        /* DISCORD ICON STYLE */
        .btn-discord:hover { border-color: var(--discord); }
        .btn-discord svg { fill: #fff; width: 22px; height: 22px; }
        .btn-discord:hover svg { fill: var(--discord); transition: 0.3s; }

        /* --- MARQUEE WORK --- */
        .marquee-section { padding: 80px 0; display: flex; flex-direction: column; gap: 25px; transform: rotate(-1deg); }
        .marquee-container { display: flex; width: 100%; overflow: hidden; }
        [class^="track"] { display: flex; gap: 25px; width: max-content; animation: scrollLeft 120s linear infinite; }
        .track-2 { animation-direction: reverse; animation-duration: 140s; }

        .card { 
            width: 520px; height: 290px; background: #000; border-radius: 16px; 
            overflow: hidden; border: 1px solid var(--border); transition: 0.6s cubic-bezier(0.2, 1, 0.3, 1);
        }
        .card:hover { transform: scale(1.03) rotate(1deg); border-color: var(--accent); z-index: 10; }
        .card img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.9); }
        .card:hover img { filter: brightness(1.1); }

        @keyframes scrollLeft { 0% { transform: translateX(0); } 100% { transform: translateX(calc(-50% - 12.5px)); } }

        footer { padding: 120px 20px; text-align: center; opacity: 0.2; font-size: 0.7rem; letter-spacing: 3px; }
    </style>
</head>
