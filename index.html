    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030303;
            --accent: #ff3e3e;
            --text: #ffffff;
            --gray: #1a1a1a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: var(--bg); 
            color: var(--text); 
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
        }

        /* --- HERO --- */
        header {
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border-bottom: 1px solid var(--gray);
        }

        h1 {
            font-size: clamp(3rem, 15vw, 9rem);
            font-weight: 700;
            letter-spacing: -4px;
            text-transform: uppercase;
            background: linear-gradient(to bottom, #fff, #444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline { font-size: 0.9rem; letter-spacing: 5px; color: var(--accent); margin-bottom: 20px; text-transform: uppercase; }

        /* --- MARQUEE SYSTEM (ROTATION + INFINI) --- */
        .marquee-section {
            padding: 100px 0;
            background: #000;
            transform: skewY(-3deg); /* Inclinaison du site */
            margin: 50px 0;
        }

        .marquee-container {
            display: flex;
            overflow: hidden;
            gap: 20px;
            padding: 40px 0;
        }

        .marquee-track {
            display: flex;
            gap: 25px;
            animation: scroll 60s linear infinite; /* Vitesse réglable ici */
        }

        .card {
            flex-shrink: 0;
            width: 450px;
            height: 280px;
            background: var(--gray);
            border-radius: 4px;
            overflow: hidden;
            transform: skewY(3deg); /* Redresse l'image par rapport au site */
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .card:hover {
            transform: skewY(3deg) scale(1.05) translateY(-20px);
            border-color: var(--accent);
            z-index: 100;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(40%);
            transition: 0.5s;
        }

        .card:hover img { filter: grayscale(0%); }

        @keyframes scroll {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        footer { padding: 100px 5%; text-align: center; opacity: 0.4; font-size: 0.8rem; letter-spacing: 2px; }
    </style>
</head>
