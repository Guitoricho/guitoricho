<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>NexCord | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --d-gray: #313338; --d-black: #111214; --d-sidebar: #2b2d31; --d-user: #232428; --d-blue: #5865f2; }
        body { background-color: var(--d-black); color: #dbdee1; font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; margin: 0; }
        .status-dot { width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--d-user); position: absolute; bottom: -2px; right: -2px; }
        .online { background: #23a55a; }
        .offline { background: #80848e; }
        .nav-btn { @apply px-4 py-1.5 rounded-md text-sm font-semibold transition-all cursor-pointer; }
        .nav-active { @apply bg-[#404249] text-white; }
        .nav-inactive { @apply text-[#b5bac1] hover:bg-[#35373c] hover:text-[#dbdee1]; }
        .badge { @apply w-4 h-4 flex items-center justify-center rounded-sm text-[10px] font-bold; }
        @keyframes pop { from { transform: scale(0.98); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .animate-pop { animation: pop 0.15s ease-out forwards; }
    </style>
</head>
<body class="flex h-screen w-screen select-none">

    <nav class="w-[72px] bg-black flex flex-col items-center py-3 gap-2 border-r border-white/5">
        <div onclick="location.reload()" class="w-12 h-12 bg-blue-600 rounded-[15px] flex items-center justify-center text-white cursor-pointer hover:rounded-[12px] transition-all">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3L4 9v12h5v-7h6v7h5V9z"/></svg>
        </div>
    </nav>

    <aside class="w-60 bg-[#2b2d31] flex flex-col">
        <div class="h-12 flex items-center px-3 border-b border-black/20 shadow-sm text-white font-bold text-sm">NexCord</div>
        <div class="flex-1 p-2 space-y-1 overflow-y-auto" id="friends-list-sidebar"></div>

        <div class="p-1.5 bg-[#232428] flex items-center gap-1">
            <div onclick="openSettings('profile')" class="flex items-center gap-2 p-1.5 hover:bg-[#35373c] rounded-md cursor-pointer flex-1 min-w-0">
                <div class="relative min-w-[32px]">
                    <img id="my-pfp" class="w-8 h-8 rounded-full object-cover">
                    <div class="status-dot online"></div>
                </div>
                <div class="truncate">
                    <div class="flex items-center gap-1">
                        <p id="my-name" class="text-[11px] font-bold text-white truncate"></p>
                        <div id="my-badges-small" class="flex gap-0.5"></div>
                    </div>
                    <p class="text-[9px] text-[#b5bac1] font-bold uppercase">En ligne</p>
                </div>
            </div>
            <button onclick="openSettings('account')" class="p-2 text-[#b5bac1] hover:bg-[#35373c] rounded-md"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col bg-[#313338]">
        <header class="h-12 border-b border-black/20 flex items-center px-4 justify-between">
            <div class="flex gap-2">
                <button onclick="changeTab('online')" id="tab-online" class="nav-btn nav-active">En ligne</button>
                <button onclick="changeTab('pending')" id="tab-pending" class="nav-btn nav-inactive relative">Attente <span id="badge-p" class="hidden bg-red-500 text-[10px] px-1 rounded-full ml-1">0</span></button>
                <button onclick="changeTab('add')" id="tab-add" class="nav-btn bg-[#248046] text-white">Ajouter</button>
            </div>
        </header>
        <div id="view-content" class="flex-1 p-6"></div>
    </main>

    <div id="settings-layer" class="fixed inset-0 z-[100] bg-[#313338] hidden flex animate-pop">
        <aside class="w-[35%] bg-[#2b2d31] flex justify-end pr-8 pt-16">
            <div class="w-48">
                <div onclick="tabSet('account')" id="t-account" class="settings-item settings-active">Mon compte</div>
                <div onclick="tabSet('profile')" id="t-profile" class="settings-item">Profil</div>
                <div onclick="logout()" class="settings-item text-red-500 mt-4">Déconnexion</div>
            </div>
        </aside>
        <main class="flex-1 pt-16 px-12 relative overflow-y-auto">
            <div id="set-content" class="max-w-2xl"></div>
            <button onclick="closeSettings()" class="fixed top-14 right-20 text-[#b5bac1] border-2 p-2 rounded-full border-[#b5bac1]">✕</button>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, onValue, set, update, push, remove, onDisconnect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDZUfpKI7Cby-H0Qy2046Ez3VP7MjS6qOE",
            authDomain: "jaster-8fdd4.firebaseapp.com",
            databaseURL: "https://jaster-8fdd4-default-rtdb.firebaseio.com",
            projectId: "jaster-8fdd4",
            storageBucket: "jaster-8fdd4.firebasestorage.app",
            messagingSenderId: "1074590705898",
            appId: "1:1074590705898:web:df5c533cdd011d074c8f93"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let myData = null;
        const BADGE_DEV = `<div class="badge bg-blue-500 text-white" title="Développeur">🔨</div>`;
        const BADGE_STAFF = `<div class="badge bg-red-500 text-white" title="Staff">⭐</div>`;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                onValue(ref(db, `users_data/${user.uid}`), (snap) => {
                    myData = snap.val() || {};
                    myData.uid = user.uid;
                    myData.email = user.email;
                    
                    // Logic Ahmed Bro Badges
                    let badgesHTML = "";
                    if (user.email === 'ahmedbro210@gmail.com') {
                        badgesHTML = BADGE_STAFF + BADGE_DEV;
                    }
                    
                    document.getElementById('my-name').innerText = myData.pseudo || "Utilisateur";
                    document.getElementById('my-pfp').src = myData.pfp || "";
                    document.getElementById('my-badges-small').innerHTML = badgesHTML;
                    
                    syncFriends();
                });
                set(ref(db, `online_users/${user.uid}`), true);
                onDisconnect(ref(db, `online_users/${user.uid}`)).remove();
                changeTab('online');
            } else {
                window.location.href = 'login.html';
            }
        });

        window.changeTab = (tab) => {
            const v = document.getElementById('view-content');
            ['online', 'pending', 'add'].forEach(t => {
                document.getElementById(`tab-${t}`).className = t === tab ? "nav-btn nav-active" : (t==='add' ? "nav-btn bg-[#248046] text-white" : "nav-btn nav-inactive");
            });

            if (tab === 'add') {
                v.innerHTML = `<div class="max-w-md animate-pop">
                    <h2 class="text-white font-bold mb-2">Ajouter un ami</h2>
                    <input id="in-target" type="text" placeholder="Pseudo exact" class="w-full bg-[#1e1f22] p-3 rounded mb-2 text-white outline-none">
                    <button onclick="sendReq()" class="bg-[#5865f2] px-4 py-2 rounded text-white font-bold">Envoyer</button>
                </div>`;
            } else if (tab === 'pending') {
                renderPending();
            } else {
                v.innerHTML = `<p class="text-zinc-600 mt-10">Amis en ligne apparaîtront ici.</p>`;
            }
        };

        window.sendReq = () => {
            const target = document.getElementById('in-target').value.trim();
            if(target && target !== myData.pseudo) {
                push(ref(db, `pending_requests/${target}`), { from: myData.pseudo, pfp: myData.pfp, uid: myData.uid });
                alert("Demande envoyée !");
            }
        };

        function renderPending() {
            onValue(ref(db, `pending_requests/${myData.pseudo}`), (snap) => {
                const reqs = snap.val();
                const v = document.getElementById('view-content');
                v.innerHTML = `<h2 class="text-[#b5bac1] text-xs font-bold uppercase mb-4">Demandes en attente</h2>`;
                if(!reqs) return;
                for(let k in reqs) {
                    v.innerHTML += `<div class="flex items-center justify-between p-3 bg-[#2b2d31] rounded-lg mb-2">
                        <div class="flex items-center gap-3"><img src="${reqs[k].pfp}" class="w-10 h-10 rounded-full"> <p class="text-white font-bold">${reqs[k].from}</p></div>
                        <button onclick="accept('${k}','${reqs[k].uid}','${reqs[k].from}','${reqs[k].pfp}')" class="bg-[#248046] px-4 py-1 rounded text-white text-xs">Accepter</button>
                    </div>`;
                }
            });
        }

        window.accept = async (k, uid, name, pfp) => {
            await update(ref(db, `friends/${myData.uid}/${uid}`), { name, pfp });
            await update(ref(db, `friends/${uid}/${myData.uid}`), { name: myData.pseudo, pfp: myData.pfp });
            await remove(ref(db, `pending_requests/${myData.pseudo}/${k}`));
        };

        function syncFriends() {
            onValue(ref(db, `friends/${myData.uid}`), (snap) => {
                const f = snap.val() || {};
                const s = document.getElementById('friends-list-sidebar');
                s.innerHTML = `<p class="text-[10px] font-black text-[#949ba4] uppercase px-2 mt-4 mb-2 tracking-widest">Messages privés</p>`;
                for(let id in f) {
                    s.innerHTML += `<div class="flex items-center gap-3 p-2 hover:bg-[#35373c] rounded-md cursor-pointer">
                        <img src="${f[id].pfp}" class="w-8 h-8 rounded-full"> <p class="text-sm font-bold">${f[id].name}</p>
                    </div>`;
                }
            });
        }

        window.openSettings = (t) => { document.getElementById('settings-layer').classList.remove('hidden'); tabSet(t); };
        window.closeSettings = () => document.getElementById('settings-layer').classList.add('hidden');
        window.tabSet = (tab) => {
            const v = document.getElementById('set-content');
            if(tab === 'profile') {
                v.innerHTML = `<h1 class="text-white text-xl font-bold mb-4">Profil</h1>
                <textarea id="set-bio" class="w-full bg-[#1e1f22] p-4 rounded text-white outline-none h-32">${myData.bio||''}</textarea>
                <button onclick="saveProfile()" class="bg-[#248046] px-6 py-2 mt-4 rounded text-white font-bold">Sauvegarder</button>`;
            } else {
                v.innerHTML = `<h1 class="text-white text-xl font-bold mb-4">Mon Compte</h1>
                <div class="bg-[#1e1f22] p-4 rounded text-white">
                    <p>Pseudo : ${myData.pseudo}</p>
                    <p>Email : ${myData.email}</p>
                </div>`;
            }
        };

        window.saveProfile = () => {
            update(ref(db, `users_data/${myData.uid}`), { bio: document.getElementById('set-bio').value });
            alert("Profil mis à jour !");
        };

        window.logout = () => signOut(auth).then(() => window.location.href = 'login.html');
    </script>
</body>
</html>
