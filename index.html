<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexCord | Professional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { background-color: #050505; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid #060606; position: absolute; bottom: 0; right: 0; }
        .online { background: #23a55a; }
        .offline { background: #80848e; }
        
        /* Transition Paramètres */
        #settings-overlay { transition: transform 0.2s ease-out, opacity 0.2s; }
        .settings-sidebar-item { @apply flex items-center px-3 py-1.5 rounded-md text-sm font-medium text-gray-400 hover:bg-white/5 hover:text-gray-200 cursor-pointer mb-0.5; }
        .settings-active { @apply bg-white/10 text-white !important; }
    </style>
</head>
<body class="flex h-screen w-screen select-none">

    <nav class="w-[72px] bg-[#020202] flex flex-col items-center py-4 gap-3 border-r border-white/5">
        <div class="w-12 h-12 bg-blue-600 rounded-[15px] flex items-center justify-center font-black italic shadow-lg shadow-blue-600/20">N</div>
    </nav>

    <aside class="w-60 bg-[#080808] border-r border-white/5 flex flex-col">
        <div class="h-12 flex items-center px-3 border-b border-white/5 text-gray-400 font-bold text-xs uppercase tracking-widest">Messages Privés</div>
        <div class="flex-1 p-2 overflow-y-auto space-y-1" id="friends-list-sidebar">
            </div>

        <div class="p-1.5 bg-[#060606] border-t border-white/5 flex items-center gap-1">
            <div onclick="openMyProfile()" class="flex items-center gap-2 p-1.5 hover:bg-white/5 rounded-md cursor-pointer flex-1 min-w-0 transition-all">
                <div class="relative min-w-[32px]">
                    <img id="my-pfp" class="w-8 h-8 rounded-full object-cover bg-gray-800">
                    <div id="my-status-dot" class="status-dot online"></div>
                </div>
                <div class="truncate">
                    <p id="my-name" class="text-[11px] font-bold truncate">...</p>
                    <p class="text-[9px] text-gray-500 font-bold uppercase tracking-tight">#0001</p>
                </div>
            </div>
            <div class="flex items-center">
                <button title="Micro" class="p-2 text-gray-400 hover:bg-white/5 rounded-md transition-all">🎙️</button>
                <button onclick="openSettings()" title="Paramètres" class="p-2 text-gray-400 hover:bg-white/5 rounded-md transition-all">⚙️</button>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col bg-[#0a0a0a]">
        <header class="h-12 border-b border-white/5 flex items-center px-4 bg-black/10 gap-4">
            <span class="text-gray-500 font-bold">@</span>
            <span id="chat-target-name" class="font-bold text-sm">Amis</span>
        </header>
        <div id="view-container" class="flex-1 p-6 flex flex-col items-center justify-center">
            <img src="https://discord.com/assets/d01073df26888200f40d.svg" class="w-48 opacity-10 mb-4">
            <p class="text-gray-600 text-sm italic font-medium text-center">Sélectionne un ami pour discuter ou va dans les paramètres pour pimper ton profil.</p>
        </div>
    </main>

    <div id="settings-overlay" class="fixed inset-0 z-[500] bg-[#0a0a0a] hidden opacity-0 flex">
        <div class="w-[35%] bg-[#080808] flex justify-end pr-6 pt-16 border-r border-white/5">
            <div class="w-52">
                <p class="text-[10px] font-black text-gray-500 uppercase px-3 mb-2 tracking-widest">Paramètres utilisateur</p>
                <div class="settings-sidebar-item settings-active">Mon compte</div>
                <div onclick="switchSettingsTab('profile')" class="settings-sidebar-item">Profil</div>
                <div class="settings-sidebar-item">Apparence</div>
                <div class="h-[1px] bg-white/5 my-2 mx-3"></div>
                <div onclick="logout()" class="settings-sidebar-item text-red-400 hover:text-red-300">Déconnexion</div>
            </div>
        </div>
        <div class="flex-1 bg-[#0a0a0a] pt-16 px-12 relative overflow-y-auto">
            <div class="max-w-3xl">
                <h2 class="text-xl font-bold mb-6">Mon compte</h2>
                <div class="bg-[#111] rounded-xl overflow-hidden border border-white/5 mb-8">
                    <div class="h-24 bg-blue-600"></div>
                    <div class="px-6 pb-6 flex items-start justify-between">
                        <div class="flex gap-4">
                            <div class="relative -mt-10 group cursor-pointer" onclick="document.getElementById('input-pfp-edit').click()">
                                <img id="edit-pfp-preview" class="w-20 h-20 rounded-2xl border-8 border-[#111] bg-gray-800 object-cover">
                                <div class="absolute inset-0 bg-black/40 rounded-2xl flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity text-[10px] font-bold">CHANGER</div>
                                <input type="file" id="input-pfp-edit" class="hidden" accept="image/*">
                            </div>
                            <div class="mt-2">
                                <p id="edit-name-display" class="text-xl font-black italic">Ahmed</p>
                                <p class="text-gray-500 text-xs">#0001</p>
                            </div>
                        </div>
                        <button onclick="saveProfileChanges()" class="mt-4 bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded text-xs font-bold uppercase transition-all">Enregistrer</button>
                    </div>
                    <div class="px-6 pb-6 space-y-4">
                        <div class="bg-black/20 p-4 rounded-lg">
                            <p class="text-[10px] font-black text-gray-500 uppercase mb-2 tracking-widest">Biographie</p>
                            <textarea id="edit-bio" class="w-full bg-transparent outline-none border-none text-sm text-gray-300 resize-none h-20" placeholder="Décris-toi..."></textarea>
                        </div>
                    </div>
                </div>
            </div>
            <button onclick="closeSettings()" class="fixed top-16 right-20 flex flex-col items-center gap-1 group">
                <div class="w-9 h-9 border-2 border-gray-500 rounded-full flex items-center justify-center group-hover:border-white group-hover:bg-white/5 transition-all">
                    <span class="text-gray-400 group-hover:text-white">✕</span>
                </div>
                <span class="text-[10px] font-bold text-gray-500 uppercase group-hover:text-white">ESC</span>
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, set, onValue, update, onDisconnect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDZUfpKI7Cby-H0Qy2046Ez3VP7MjS6qOE",
            authDomain: "jaster-8fdd4.firebaseapp.com",
            databaseURL: "https://jaster-8fdd4-default-rtdb.firebaseio.com",
            projectId: "jaster-8fdd4",
            storageBucket: "jaster-8fdd4.firebasestorage.app",
            messagingSenderId: "1074590705898",
            appId: "1:1074590705898:web:df5c533cdd011d074c8f93"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let userSession = null;
        let pfpBase64 = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                onValue(ref(db, `users_data/${user.uid}`), (snap) => {
                    userSession = snap.val() || {};
                    updateUI();
                    listenToFriends();
                });
                
                // Presence
                const presenceRef = ref(db, `online_users/${user.uid}`);
                set(presenceRef, true);
                onDisconnect(presenceRef).remove();
            } else {
                window.location.href = "login.html";
            }
        });

        function updateUI() {
            document.getElementById('my-name').innerText = userSession.pseudo || "Anonyme";
            document.getElementById('my-pfp').src = userSession.pfp || "https://ui-avatars.com/api/?background=random";
            document.getElementById('edit-pfp-preview').src = userSession.pfp || "https://ui-avatars.com/api/?background=random";
            document.getElementById('edit-bio').value = userSession.bio || "";
            document.getElementById('edit-name-display').innerText = userSession.pseudo;
        }

        // --- GESTION DES AMIS (PERSISTANTS) ---
        function listenToFriends() {
            onValue(ref(db, `friends/${auth.currentUser.uid}`), (friendsSnap) => {
                const friends = friendsSnap.val() || {};
                onValue(ref(db, 'online_users'), (onlineSnap) => {
                    const onlineUsers = onlineSnap.val() || {};
                    const container = document.getElementById('friends-list-sidebar');
                    container.innerHTML = "";
                    
                    Object.keys(friends).forEach(id => {
                        const isOnline = onlineUsers[id] ? true : false;
                        const f = friends[id];
                        container.innerHTML += `
                            <div class="flex items-center gap-3 p-2 rounded-md hover:bg-white/5 cursor-pointer group transition-all">
                                <div class="relative">
                                    <img src="${f.pfp}" class="w-8 h-8 rounded-full object-cover bg-gray-800 ${!isOnline ? 'grayscale opacity-50' : ''}">
                                    <div class="status-dot ${isOnline ? 'online' : 'offline'}"></div>
                                </div>
                                <div class="truncate flex-1">
                                    <p class="text-xs font-bold ${isOnline ? 'text-gray-200' : 'text-gray-500'} group-hover:text-white transition-colors">${f.name}</p>
                                    <p class="text-[9px] text-gray-600 font-bold uppercase tracking-tight">${isOnline ? 'En ligne' : 'Hors ligne'}</p>
                                </div>
                            </div>`;
                    });
                });
            });
        }

        // --- PARAMÈTRES & PROFIL ---
        window.openSettings = () => {
            const el = document.getElementById('settings-overlay');
            el.classList.remove('hidden');
            setTimeout(() => { el.style.opacity = "1"; el.style.transform = "scale(1)"; }, 10);
        };

        window.closeSettings = () => {
            const el = document.getElementById('settings-overlay');
            el.style.opacity = "0"; el.style.transform = "scale(1.1)";
            setTimeout(() => el.classList.add('hidden'), 200);
        };

        window.saveProfileChanges = async () => {
            const newBio = document.getElementById('edit-bio').value;
            const updates = { bio: newBio };
            if (pfpBase64) updates.pfp = pfpBase64;
            
            await update(ref(db, `users_data/${auth.currentUser.uid}`), updates);
            alert("Profil mis à jour ! 🔥");
        };

        // Upload PFP
        document.getElementById('input-pfp-edit').onchange = (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onloadend = () => {
                pfpBase64 = reader.result;
                document.getElementById('edit-pfp-preview').src = pfpBase64;
            };
            if (file) reader.readAsDataURL(file);
        };

        window.logout = () => signOut(auth).then(() => window.location.reload());

        window.openMyProfile = () => {
            // Dans Discord, cliquer sur l'avatar ouvre souvent un mini-profil ou les paramètres. 
            // Ici on redirige vers l'onglet Profil des paramètres.
            openSettings();
        };
    </script>
</body>
</html>
