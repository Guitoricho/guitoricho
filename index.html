<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexCord | v2.1 Fixed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { background-color: #050505; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .custom-scrollbar::-webkit-scrollbar { width: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .fade-in { animation: fadeIn 0.5s ease-in-out forwards; }
    </style>
</head>
<body class="flex h-screen">

    <div id="auth-screen" class="fixed inset-0 z-[100] flex items-center justify-center bg-black">
        <div class="glass p-12 rounded-[3rem] w-[400px] text-center border-white/10 shadow-2xl">
            <div id="auth-logo" class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-8 shadow-2xl shadow-blue-600/20 text-2xl font-black">N</div>
            <h1 class="text-3xl font-black mb-2 tracking-tighter">NexCord</h1>
            <p id="auth-msg" class="text-gray-500 mb-10 text-sm font-medium italic">Vérification de la session...</p>
            
            <button id="btn-google" class="hidden w-full bg-white text-black font-bold py-4 rounded-xl flex items-center justify-center gap-3 hover:bg-gray-200 transition-all active:scale-95">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" class="w-5">
                Continuer avec Google
            </button>
            <div id="loader" class="flex justify-center"><div class="w-6 h-6 border-2 border-blue-500 border-t-transparent rounded-full animate-spin"></div></div>
        </div>
    </div>

    <div id="main-ui" class="hidden flex h-screen w-full fade-in">
        <aside class="w-72 bg-[#080808] border-r border-white/5 flex flex-col">
            <div class="p-6 h-16 border-b border-white/5 flex items-center font-black text-blue-500 italic tracking-tighter">NEXCORD</div>
            <div id="users-list" class="flex-1 overflow-y-auto p-4 space-y-2 text-sm custom-scrollbar"></div>
            <div class="p-4 bg-black/40 border-t border-white/5 flex items-center gap-3">
                <img id="my-pfp" class="w-10 h-10 rounded-full object-cover bg-gray-800">
                <div class="flex-1 truncate">
                    <p id="my-name" class="text-xs font-bold truncate">Pseudo</p>
                    <span class="text-[8px] text-green-500 font-bold uppercase tracking-widest">Connecté</span>
                </div>
            </div>
        </aside>

        <main class="flex-1 flex flex-col bg-[#0a0a0a]">
            <header class="h-16 border-b border-white/5 flex items-center px-8 bg-black/10 backdrop-blur-md">
                <span class="text-blue-500 font-bold mr-2">#</span><span class="font-bold text-sm uppercase tracking-widest text-gray-400">Salon-Global</span>
            </header>
            <div id="chat-box" class="flex-1 overflow-y-auto p-8 space-y-6 custom-scrollbar"></div>
            <div class="px-8 pb-8">
                <div class="glass rounded-2xl flex items-center p-2 border-white/10 focus-within:border-blue-500/50 transition-all shadow-2xl">
                    <input type="text" id="chat-input" placeholder="Écris quelque chose..." class="flex-1 bg-transparent py-4 px-4 outline-none text-sm text-gray-200">
                    <button id="btn-send" class="bg-blue-600 px-6 py-3 rounded-xl hover:bg-blue-500 transition-all text-xs font-bold uppercase">Envoyer</button>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithRedirect, getRedirectResult, GoogleAuthProvider, onAuthStateChanged, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, push, set, onChildAdded, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDZUfpKI7Cby-H0Qy2046Ez3VP7MjS6qOE",
            authDomain: "jaster-8fdd4.firebaseapp.com",
            projectId: "jaster-8fdd4",
            storageBucket: "jaster-8fdd4.firebasestorage.app",
            messagingSenderId: "1074590705898",
            appId: "1:1074590705898:web:df5c533cdd011d074c8f93",
            databaseURL: "https://jaster-8fdd4-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const provider = new GoogleAuthProvider();

        // 1. GÉRER LE RETOUR DE REDIRECTION IMMÉDIATEMENT
        getRedirectResult(auth)
            .then((result) => {
                if (result) {
                    console.log("Connecté via redirection !");
                }
            })
            .catch((error) => {
                console.error("Erreur de redirection : ", error);
                document.getElementById('auth-msg').innerText = "Erreur. Veuillez réessayer.";
            });

        // 2. ÉCOUTER L'ÉTAT DE L'UTILISATEUR
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('main-ui').classList.remove('hidden');
                initApp(user);
            } else {
                // Si pas de session, on montre le bouton
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('btn-google').classList.remove('hidden');
                document.getElementById('auth-msg').innerText = "Connectez-vous pour continuer";
            }
        });

        // 3. ACTION DU BOUTON (Tentative Redirect -> Fallback Popup)
        document.getElementById('btn-google').onclick = () => {
            document.getElementById('btn-google').classList.add('hidden');
            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('auth-msg').innerText = "Redirection vers Google...";
            
            // Si on est sur un fichier local (file://), Popup est parfois plus stable
            if (window.location.protocol === 'file:') {
                signInWithPopup(auth, provider).catch(e => {
                    console.log("Popup bloqué, tentative redirection...");
                    signInWithRedirect(auth, provider);
                });
            } else {
                signInWithRedirect(auth, provider);
            }
        };

        // 4. LOGIQUE DE L'APPLICATION
        function initApp(user) {
            document.getElementById('my-name').innerText = user.displayName;
            document.getElementById('my-pfp').src = user.photoURL;

            // Presence
            set(ref(db, `online_users/${user.uid}`), {
                name: user.displayName,
                pfp: user.photoURL
            });

            // Chat Read
            onChildAdded(ref(db, 'messages'), (snap) => {
                const m = snap.val();
                document.getElementById('chat-box').innerHTML += `
                    <div class="flex gap-4 animate-msg">
                        <img src="${m.pfp}" class="w-10 h-10 rounded-xl object-cover border border-white/10">
                        <div>
                            <p class="text-blue-500 font-bold text-[10px] uppercase mb-1">${m.author}</p>
                            <p class="text-gray-300 text-sm">${m.text}</p>
                        </div>
                    </div>`;
                document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;
            });

            // Chat Write
            const send = () => {
                const el = document.getElementById('chat-input');
                if(el.value.trim()){
                    push(ref(db, 'messages'), {
                        author: user.displayName,
                        pfp: user.photoURL,
                        text: el.value,
                        timestamp: serverTimestamp()
                    });
                    el.value = "";
                }
            };
            document.getElementById('btn-send').onclick = send;
            document.getElementById('chat-input').onkeypress = (e) => { if(e.key === 'Enter') send(); };

            // Users List
            onValue(ref(db, 'online_users'), (snap) => {
                const users = snap.val();
                const container = document.getElementById('users-list');
                container.innerHTML = "";
                for(let id in users){
                    container.innerHTML += `
                        <div class="flex items-center gap-3 p-2 rounded-xl hover:bg-white/5 transition-all">
                            <img src="${users[id].pfp}" class="w-8 h-8 rounded-lg object-cover">
                            <span class="font-bold text-xs text-gray-300">${users[id].name}</span>
                        </div>`;
                }
            });
        }
    </script>
</body>
</html>
