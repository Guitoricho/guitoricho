<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexCord | Premium Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { background-color: #050505; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .server-icon { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
        .server-icon:hover { border-radius: 12px; background: #2563eb; color: white; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #222; border-radius: 10px; }
        .badge { font-size: 8px; padding: 2px 6px; border-radius: 4px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
        .badge-admin { background: #ef4444; color: white; box-shadow: 0 0 10px rgba(239, 68, 68, 0.3); }
        .badge-dev { background: #3b82f6; color: white; }
        .badge-pro { background: #10b981; color: white; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-pop { animation: slideUp 0.3s ease-out; }
    </style>
</head>
<body class="flex h-screen w-screen">

    <nav class="w-[72px] bg-[#020202] flex flex-col items-center py-4 gap-3 border-r border-white/5">
        <div class="server-icon w-12 h-12 bg-blue-600 rounded-[20px] flex items-center justify-center font-black text-xl italic shadow-2xl shadow-blue-600/20">N</div>
        <div class="w-8 h-[2px] bg-white/10 rounded-full my-1"></div>
        <div class="server-icon w-12 h-12 bg-white/5 rounded-[24px] flex items-center justify-center text-gray-500 hover:text-white font-bold text-xl">＋</div>
    </nav>

    <aside class="w-60 bg-[#080808] border-r border-white/5 flex flex-col">
        <div class="h-14 flex items-center px-4 font-extrabold text-sm border-b border-white/5 tracking-tight shadow-sm">NEXCORD SERVER ⚙️</div>
        <div class="flex-1 overflow-y-auto p-3 space-y-6">
            <div>
                <p class="text-[10px] font-black text-gray-600 uppercase tracking-widest px-2 mb-2">Salons Textuels</p>
                <div class="space-y-1">
                    <div class="flex items-center gap-2 px-3 py-2 rounded-lg bg-white/5 text-gray-200 text-sm font-semibold cursor-pointer border-l-2 border-blue-500">
                        <span class="text-gray-500 text-xl font-medium">#</span> général
                    </div>
                    <div class="flex items-center gap-2 px-3 py-2 rounded-lg text-gray-500 hover:bg-white/5 hover:text-gray-300 text-sm font-semibold cursor-pointer transition-all">
                        <span class="text-gray-600 text-xl font-medium">#</span> photos-autos
                    </div>
                </div>
            </div>
        </div>
        <div class="p-3 bg-black/40 border-t border-white/5 flex items-center gap-3">
            <div class="relative">
                <img id="my-pfp" class="w-8 h-8 rounded-lg object-cover bg-gray-800">
                <div class="absolute -bottom-1 -right-1 w-3 h-3 bg-green-500 border-2 border-[#080808] rounded-full"></div>
            </div>
            <div class="flex-1 truncate">
                <p id="my-name" class="text-[11px] font-bold truncate">Pseudo</p>
                <p class="text-[8px] text-gray-500 font-bold uppercase tracking-widest">En ligne</p>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col bg-[#0a0a0a]">
        <header class="h-14 border-b border-white/5 flex items-center px-6 bg-black/20 backdrop-blur-md justify-between">
            <div class="flex items-center gap-2">
                <span class="text-gray-500 text-xl">#</span>
                <span class="font-bold text-sm tracking-tight">général</span>
            </div>
        </header>

        <div id="chat-box" class="flex-1 overflow-y-auto p-6 space-y-6 custom-scrollbar">
            </div>

        <div class="px-6 pb-6">
            <div class="glass rounded-xl flex items-center p-2 border-white/10 focus-within:border-blue-500/30 transition-all">
                <button class="p-2 text-gray-500 hover:text-white transition-colors">➕</button>
                <input type="text" id="chat-input" placeholder="Envoyer un message dans #général" class="flex-1 bg-transparent py-3 px-3 outline-none text-sm placeholder:text-gray-700">
                <button id="btn-send" class="bg-blue-600 px-5 py-2.5 rounded-lg hover:bg-blue-500 transition-all text-[10px] font-bold uppercase tracking-widest shadow-lg shadow-blue-600/10">Envoyer</button>
            </div>
        </div>
    </main>

    <aside class="w-60 bg-[#080808] border-l border-white/5 flex flex-col p-4">
        <p class="text-[10px] font-black text-gray-600 uppercase tracking-widest mb-4">Membres — <span id="member-count">0</span></p>
        <div id="users-list" class="space-y-2 overflow-y-auto custom-scrollbar">
            </div>
    </aside>

    <div id="profile-modal" class="hidden fixed inset-0 z-[200] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="w-[340px] bg-[#111] rounded-2xl overflow-hidden shadow-2xl border border-white/10 animate-pop">
            <div class="h-24 bg-gradient-to-r from-blue-600 to-purple-600 relative">
                <img id="modal-pfp" class="absolute -bottom-10 left-4 w-20 h-20 rounded-2xl border-4 border-[#111] bg-gray-800 object-cover">
            </div>
            <div class="pt-12 p-5">
                <h2 id="modal-name" class="text-xl font-extrabold tracking-tight">Nom</h2>
                <p id="modal-tag" class="text-gray-500 text-xs mb-4">@utilisateur</p>
                
                <div class="space-y-4">
                    <div class="h-[1px] bg-white/5"></div>
                    <div>
                        <p class="text-[9px] font-black text-gray-400 uppercase tracking-widest mb-2">Badges</p>
                        <div id="modal-badges" class="flex flex-wrap gap-2">
                            </div>
                    </div>
                    <div>
                        <p class="text-[9px] font-black text-gray-400 uppercase tracking-widest mb-1">Bio</p>
                        <p id="modal-bio" class="text-xs text-gray-400 leading-relaxed italic">Aucune bio disponible.</p>
                    </div>
                </div>
                <button onclick="document.getElementById('profile-modal').classList.add('hidden')" class="w-full mt-6 bg-white/5 py-3 rounded-xl text-[10px] font-bold uppercase tracking-widest hover:bg-white/10 transition-all">Fermer</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, push, set, onChildAdded, onValue, serverTimestamp, onDisconnect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // CONFIG (Même config que précédemment)
        const firebaseConfig = {
            apiKey: "AIzaSyDZUfpKI7Cby-H0Qy2046Ez3VP7MjS6qOE",
            authDomain: "jaster-8fdd4.firebaseapp.com",
            databaseURL: "https://jaster-8fdd4-default-rtdb.firebaseio.com",
            projectId: "jaster-8fdd4",
            storageBucket: "jaster-8fdd4.firebasestorage.app",
            messagingSenderId: "1074590705898",
            appId: "1:1074590705898:web:df5c533cdd011d074c8f93"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        onAuthStateChanged(auth, (user) => {
            if (user) startNexCord(user);
            else window.location.href = "login.html"; // Assure-toi d'avoir ta page de login
        });

        function startNexCord(user) {
            const myRef = ref(db, `online_users/${user.uid}`);
            
            // Récupérer mes infos étendues (badges, bio)
            onValue(ref(db, `users_data/${user.uid}`), (snap) => {
                const data = snap.val();
                const myInfo = {
                    name: data?.pseudo || user.displayName,
                    pfp: data?.pfp || user.photoURL,
                    bio: data?.bio || "Fan de NexCord",
                    role: data?.role || "Membre",
                    badges: data?.badges || ["PRO"] // Badges par défaut
                };

                document.getElementById('my-name').innerText = myInfo.name;
                document.getElementById('my-pfp').src = myInfo.pfp;
                
                // Présence
                set(myRef, myInfo);
                onDisconnect(myRef).remove();
            });

            // Affichage des Membres
            onValue(ref(db, 'online_users'), (snap) => {
                const users = snap.val();
                const container = document.getElementById('users-list');
                container.innerHTML = "";
                let count = 0;
                for (let id in users) {
                    count++;
                    const u = users[id];
                    const roleColor = u.role === 'Admin' ? 'text-red-400' : 'text-gray-300';
                    const item = document.createElement('div');
                    item.className = "flex items-center gap-3 p-2 rounded-lg hover:bg-white/5 cursor-pointer group transition-all";
                    item.innerHTML = `
                        <img src="${u.pfp}" class="w-8 h-8 rounded-lg object-cover">
                        <div class="flex-1 truncate">
                            <p class="text-xs font-bold ${roleColor}">${u.name}</p>
                            <div class="flex gap-1">${(u.badges || []).map(b => `<span class="badge badge-${b.toLowerCase()}">${b}</span>`).join('')}</div>
                        </div>`;
                    item.onclick = () => showProfile(u);
                    container.appendChild(item);
                }
                document.getElementById('member-count').innerText = count;
            });

            // Chat Logic
            onChildAdded(ref(db, 'messages'), (snap) => {
                const m = snap.val();
                const time = m.timestamp ? new Date(m.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';
                document.getElementById('chat-box').innerHTML += `
                    <div class="flex gap-4 group">
                        <img src="${m.pfp}" class="w-10 h-10 rounded-xl object-cover border border-white/5 shadow-lg group-hover:border-blue-500/50 transition-all">
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <span class="text-blue-500 font-bold text-[11px] uppercase">${m.author}</span>
                                <span class="text-[9px] text-gray-700 font-bold">${time}</span>
                            </div>
                            <p class="text-gray-300 text-sm leading-relaxed">${m.text}</p>
                        </div>
                    </div>`;
                document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;
            });

            const send = () => {
                const input = document.getElementById('chat-input');
                if (input.value.trim()) {
                    push(ref(db, 'messages'), { author: user.displayName || "Anonyme", pfp: user.photoURL, text: input.value, timestamp: serverTimestamp() });
                    input.value = "";
                }
            };
            document.getElementById('btn-send').onclick = send;
            document.getElementById('chat-input').onkeypress = (e) => { if(e.key === 'Enter') send(); };
        }

        // Système de Profil
        function showProfile(u) {
            document.getElementById('modal-name').innerText = u.name;
            document.getElementById('modal-pfp').src = u.pfp;
            document.getElementById('modal-bio').innerText = u.bio || "Aucune bio.";
            document.getElementById('modal-tag').innerText = `@${u.name.replace(/\s/g, '').toLowerCase()}`;
            
            const badgeContainer = document.getElementById('modal-badges');
            badgeContainer.innerHTML = (u.badges || []).map(b => `<span class="badge badge-${b.toLowerCase()} p-1.5 px-3">${b}</span>`).join('');
            
            document.getElementById('profile-modal').classList.remove('hidden');
        }
    </script>
</body>
</html>
