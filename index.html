<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexCord | Projet Jaster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { background-color: #050505; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .custom-scrollbar::-webkit-scrollbar { width: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        .animate-msg { animation: slideIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="flex h-screen text-gray-100">

    <div id="auth-screen" class="fixed inset-0 z-[100] flex items-center justify-center bg-black">
        <div class="glass p-12 rounded-[3rem] w-[420px] text-center border-white/10 shadow-2xl">
            <div class="w-20 h-20 bg-blue-600 rounded-[2rem] flex items-center justify-center mx-auto mb-8 shadow-2xl shadow-blue-600/20 text-3xl font-black">N</div>
            <h1 class="text-4xl font-black mb-2 tracking-tighter">NexCord</h1>
            <p class="text-gray-500 mb-10 text-sm font-medium">Connectez-vous pour rejoindre le réseau</p>
            <button id="btn-google" class="w-full bg-white text-black font-bold py-4 rounded-2xl flex items-center justify-center gap-3 hover:bg-gray-200 transition-all active:scale-95">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" class="w-5">
                Continuer avec Google
            </button>
        </div>
    </div>

    <aside class="w-80 bg-[#080808] border-r border-white/5 flex flex-col">
        <div class="p-6 h-16 flex items-center justify-between border-b border-white/5">
            <span class="font-black text-blue-500 tracking-tighter italic">NEXCORD</span>
            <button onclick="toggleSettings()" class="text-gray-500 hover:text-white transition-colors">⚙️</button>
        </div>

        <div class="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-2" id="users-list">
            </div>

        <div class="p-4 bg-black/40 border-t border-white/5 flex items-center gap-3">
            <img id="my-pfp" src="" class="w-10 h-10 rounded-full object-cover bg-gray-800">
            <div class="flex-1 truncate">
                <p id="my-name" class="text-sm font-bold truncate">Utilisateur</p>
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 bg-green-500 rounded-full"></span>
                    <span class="text-[9px] text-gray-500 font-bold uppercase tracking-widest">En ligne</span>
                </div>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col">
        <header class="h-16 border-b border-white/5 flex items-center px-8 bg-black/20 backdrop-blur-md">
            <span class="text-blue-500 font-bold mr-2 text-xl">#</span>
            <span class="font-bold text-sm tracking-tight">salon-principal</span>
        </header>

        <div id="chat-box" class="flex-1 overflow-y-auto p-8 space-y-6 custom-scrollbar">
            </div>

        <div class="px-8 pb-8">
            <div id="typing-indicator" class="text-[10px] text-gray-500 h-4 mb-2 italic ml-4"></div>
            <div class="glass rounded-2xl flex items-center p-2 border-white/10 focus-within:border-blue-500/50 transition-all shadow-2xl">
                <label class="p-3 hover:bg-white/5 rounded-xl cursor-pointer transition-all">
                    ➕<input type="file" id="chat-file" class="hidden" accept="image/*">
                </label>
                <input type="text" id="chat-input" placeholder="Envoyer un message..." class="flex-1 bg-transparent py-4 px-3 outline-none text-sm">
                <button id="btn-send" class="bg-blue-600 p-3 rounded-xl hover:bg-blue-500 transition-all text-sm font-bold">Envoyer</button>
            </div>
        </div>
    </main>

    <div id="settings-modal" class="hidden fixed inset-0 z-[110] bg-black/90 backdrop-blur-xl flex items-center justify-center p-4">
        <div class="glass w-full max-w-md rounded-[2.5rem] overflow-hidden p-8 border border-white/10">
            <h2 class="text-2xl font-black mb-6">Paramètres du profil</h2>
            <div class="space-y-6">
                <div class="flex items-center gap-4">
                    <img id="set-pfp" class="w-20 h-20 rounded-full object-cover border-2 border-blue-500">
                    <label class="bg-white/5 px-4 py-2 rounded-lg text-xs font-bold cursor-pointer hover:bg-white/10">
                        Changer la photo
                        <input type="file" id="update-pfp" class="hidden" accept="image/*">
                    </label>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest ml-1">Ma Bio</label>
                    <textarea id="set-bio" class="w-full bg-white/5 p-4 rounded-xl mt-2 outline-none border border-white/5 focus:border-blue-500 h-24 text-sm resize-none"></textarea>
                </div>
                <button onclick="saveSettings()" class="w-full bg-blue-600 py-4 rounded-xl font-bold hover:bg-blue-500 shadow-xl shadow-blue-600/10">Enregistrer</button>
                <button onclick="toggleSettings()" class="w-full text-gray-500 text-xs font-bold">Fermer</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, push, set, onChildAdded, onValue, serverTimestamp, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        // CONFIGURATION (TES CLÉS)
        const firebaseConfig = {
            apiKey: "AIzaSyDZUfpKI7Cby-H0Qy2046Ez3VP7MjS6qOE",
            authDomain: "jaster-8fdd4.firebaseapp.com",
            projectId: "jaster-8fdd4",
            storageBucket: "jaster-8fdd4.firebasestorage.app",
            messagingSenderId: "1074590705898",
            appId: "1:1074590705898:web:df5c533cdd011d074c8f93",
            databaseURL: "https://jaster-8fdd4-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const storage = getStorage(app);
        const provider = new GoogleAuthProvider();

        let user = null;
        let typingTimeout = null;

        // AUTHENTICATION
        document.getElementById('btn-google').onclick = () => signInWithPopup(auth, provider);

        onAuthStateChanged(auth, (u) => {
            if (u) {
                user = u;
                document.getElementById('auth-screen').style.display = 'none';
                syncUser();
                initChat();
                initPresence();
            }
        });

        // SYNC PROFILE & SETTINGS
        window.toggleSettings = () => document.getElementById('settings-modal').classList.toggle('hidden');

        async function syncUser() {
            onValue(ref(db, `users/${user.uid}`), (snap) => {
                const data = snap.val() || {};
                const pfp = data.pfp || user.photoURL;
                document.getElementById('my-name').innerText = user.displayName;
                document.getElementById('my-pfp').src = pfp;
                document.getElementById('set-pfp').src = pfp;
                document.getElementById('set-bio').value = data.bio || "";
            });
        }

        window.saveSettings = async () => {
            await set(ref(db, `users/${user.uid}/bio`), document.getElementById('set-bio').value);
            toggleSettings();
        };

        document.getElementById('update-pfp').onchange = async (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const fileRef = sRef(storage, `pfps/${user.uid}`);
            await uploadBytes(fileRef, file);
            const url = await getDownloadURL(fileRef);
            set(ref(db, `users/${user.uid}/pfp`), url);
        };

        // CHAT LOGIC
        function initChat() {
            onChildAdded(ref(db, 'messages'), (snap) => {
                const m = snap.val();
                const time = m.timestamp ? new Date(m.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';
                const content = m.type === 'image' 
                    ? `<img src="${m.url}" class="max-w-xs rounded-2xl border border-white/10 mt-3 shadow-2xl">` 
                    : `<p class="text-gray-300 text-sm leading-relaxed">${m.text}</p>`;

                document.getElementById('chat-box').innerHTML += `
                    <div class="flex gap-4 animate-msg group">
                        <img src="${m.pfp}" class="w-10 h-10 rounded-xl object-cover shadow-lg border border-white/5">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="text-blue-400 font-bold text-xs uppercase tracking-tight">${m.author}</span>
                                <span class="text-[9px] text-gray-700 font-bold">${time}</span>
                            </div>
                            ${content}
                        </div>
                    </div>`;
                document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;
            });
        }

        const sendMessage = (data) => {
            push(ref(db, 'messages'), {
                author: user.displayName,
                pfp: document.getElementById('my-pfp').src,
                timestamp: serverTimestamp(),
                ...data
            });
        };

        document.getElementById('btn-send').onclick = () => {
            const input = document.getElementById('chat-input');
            if(input.value.trim()){
                sendMessage({ text: input.value, type: 'text' });
                input.value = "";
                remove(ref(db, `typing/${user.uid}`));
            }
        };

        document.getElementById('chat-file').onchange = async (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const fileRef = sRef(storage, `chat/${Date.now()}`);
            await uploadBytes(fileRef, file);
            const url = await getDownloadURL(fileRef);
            sendMessage({ url, type: 'image' });
        };

        // TYPING & PRESENCE
        document.getElementById('chat-input').oninput = () => {
            set(ref(db, `typing/${user.uid}`), user.displayName);
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => remove(ref(db, `typing/${user.uid}`)), 2000);
        };

        onValue(ref(db, 'typing'), (snap) => {
            const data = snap.val();
            const el = document.getElementById('typing-indicator');
            if(!data) return el.innerText = "";
            const names = Object.values(data).filter(n => n !== user.displayName);
            el.innerText = names.length > 0 ? names.join(', ') + " écrit..." : "";
        });

        function initPresence() {
            const onlineRef = ref(db, `online_users/${user.uid}`);
            onValue(ref(db, `users/${user.uid}`), (snap) => {
                const userData = snap.val() || {};
                set(onlineRef, {
                    name: user.displayName,
                    pfp: userData.pfp || user.photoURL,
                    bio: userData.bio || ""
                });
            });
            onValue(ref(db, 'online_users'), (snap) => {
                const users = snap.val();
                const container = document.getElementById('users-list');
                container.innerHTML = "";
                for(let id in users) {
                    const u = users[id];
                    container.innerHTML += `
                        <div class="flex items-center gap-3 p-3 hover:bg-white/5 rounded-2xl transition-all group cursor-pointer">
                            <div class="relative">
                                <img src="${u.pfp}" class="w-10 h-10 rounded-xl object-cover border border-white/5">
                                <div class="absolute -bottom-1 -right-1 w-3 h-3 bg-green-500 border-2 border-[#080808] rounded-full"></div>
                            </div>
                            <div class="flex-1 truncate">
                                <p class="text-xs font-bold text-gray-200">${u.name}</p>
                                <p class="text-[9px] text-gray-600 truncate">${u.bio || 'Membre NexCord'}</p>
                            </div>
                        </div>`;
                }
            });
        }
    </script>
</body>
</html>
