<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>NexCord | Messagerie</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --d-gray: #313338; --d-black: #111214; --d-sidebar: #2b2d31; --d-user: #232428; --d-blue: #5865f2; }
        body { background-color: var(--d-black); color: #dbdee1; font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; margin: 0; }
        .status-dot { width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--d-sidebar); position: absolute; bottom: -2px; right: -2px; }
        .online { background: #23a55a; }
        .offline { background: #80848e; }
        .nav-btn { @apply px-4 py-1.5 rounded-md text-sm font-semibold transition-all cursor-pointer; }
        .nav-active { @apply bg-[#404249] text-white; }
        .badge-red { @apply absolute -top-1 -right-1 bg-[#f23f42] text-white text-[10px] font-bold px-1.5 rounded-full border-2 border-[#2b2d31]; }
        .chat-input { background: #383a40; border-radius: 8px; padding: 10px 15px; width: 100%; color: white; outline: none; }
        
        /* Scrollbar Style Discord */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #2b2d31; }
        ::-webkit-scrollbar-thumb { background: #1a1b1e; border-radius: 10px; }
        
        @keyframes slideIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }
        .msg-anim { animation: slideIn 0.2s ease-out; }
    </style>
</head>
<body class="flex h-screen w-screen select-none">

    <nav class="w-[72px] bg-black flex flex-col items-center py-3 gap-2 border-r border-white/5">
        <div onclick="location.reload()" class="w-12 h-12 bg-blue-600 rounded-[15px] flex items-center justify-center text-white cursor-pointer hover:rounded-[12px] transition-all">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3L4 9v12h5v-7h6v7h5V9z"/></svg>
        </div>
    </nav>

    <aside class="w-60 bg-[#2b2d31] flex flex-col">
        <div class="h-12 flex items-center px-3 border-b border-black/20 shadow-sm text-white font-bold text-sm">NexCord</div>
        <div class="flex-1 p-2 space-y-0.5 overflow-y-auto" id="friends-list-sidebar">
            <p class="text-[10px] font-black text-[#949ba4] uppercase px-2 mt-4 mb-2 tracking-widest">Messages privés</p>
            </div>

        <div class="p-1.5 bg-[#232428] flex items-center gap-1">
            <div onclick="openSettings('profile')" class="flex items-center gap-2 p-1.5 hover:bg-[#35373c] rounded-md cursor-pointer flex-1 min-w-0">
                <img id="my-pfp" class="w-8 h-8 rounded-full object-cover bg-zinc-800">
                <div class="truncate">
                    <p id="my-name" class="text-[11px] font-bold text-white truncate"></p>
                    <p class="text-[9px] text-[#b5bac1] font-bold uppercase">En ligne</p>
                </div>
            </div>
            <button onclick="logout()" class="p-2 text-[#b5bac1] hover:text-red-400"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M10 2v2H5v16h5v2H3V2h7zm9 11H9v-2h10V7l5 5-5 5v-4z"/></svg></button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col bg-[#313338]" id="main-container">
        <header id="chat-header" class="h-12 border-b border-black/20 flex items-center px-4 bg-[#313338] shadow-sm">
            <div class="flex gap-2">
                <button onclick="changeTab('online')" id="tab-online" class="nav-btn nav-active">En ligne</button>
                <button onclick="changeTab('pending')" id="tab-pending" class="nav-btn text-[#b5bac1] hover:bg-[#35373c]">Attente</button>
                <button onclick="changeTab('add')" id="tab-add" class="nav-btn bg-[#248046] text-white">Ajouter</button>
            </div>
        </header>

        <div id="view-content" class="flex-1 flex flex-col overflow-hidden">
            <div class="flex flex-col items-center justify-center h-full opacity-20">
                <img src="https://discord.com/assets/d01073df26888200f40d.svg" class="w-64">
                <p class="font-bold mt-4">Sélectionne un ami pour discuter</p>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, onValue, set, update, push, remove, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDZUfpKI7Cby-H0Qy2046Ez3VP7MjS6qOE",
            authDomain: "jaster-8fdd4.firebaseapp.com",
            databaseURL: "https://jaster-8fdd4-default-rtdb.firebaseio.com",
            projectId: "jaster-8fdd4",
            storageBucket: "jaster-8fdd4.firebasestorage.app",
            messagingSenderId: "1074590705898",
            appId: "1:1074590705898:web:df5c533cdd011d074c8f93"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let myData = null;
        let activeChatFriendId = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                onValue(ref(db, `users_data/${user.uid}`), (snap) => {
                    myData = snap.val() || {};
                    myData.uid = user.uid;
                    document.getElementById('my-name').innerText = myData.pseudo;
                    document.getElementById('my-pfp').src = myData.pfp;
                    syncSidebar();
                    listenToNotifications();
                });
            } else { window.location.href = 'login.html'; }
        });

        // --- SYNC SIDEBAR & NOTIFICATIONS ---
        function syncSidebar() {
            onValue(ref(db, `friends/${myData.uid}`), (snap) => {
                const friends = snap.val() || {};
                const side = document.getElementById('friends-list-sidebar');
                side.innerHTML = `<p class="text-[10px] font-black text-[#949ba4] uppercase px-2 mt-4 mb-2 tracking-widest">Messages privés</p>`;
                
                for(let id in friends) {
                    side.innerHTML += `
                    <div onclick="openChat('${id}', '${friends[id].name}', '${friends[id].pfp}')" class="relative flex items-center gap-3 p-2 rounded-md hover:bg-[#35373c] cursor-pointer group transition-all mx-2">
                        <div class="relative min-w-[32px]">
                            <img src="${friends[id].pfp}" class="w-8 h-8 rounded-full object-cover">
                            <div id="notif-${id}" class="badge-red hidden">0</div>
                        </div>
                        <p class="text-sm font-bold text-[#949ba4] group-hover:text-white truncate">${friends[id].name}</p>
                    </div>`;
                }
            });
        }

        function listenToNotifications() {
            onValue(ref(db, `notifications/${myData.uid}`), (snap) => {
                const notifs = snap.val() || {};
                for(let senderId in notifs) {
                    const el = document.getElementById(`notif-${senderId}`);
                    if(el && notifs[senderId] > 0 && activeChatFriendId !== senderId) {
                        el.innerText = notifs[senderId];
                        el.classList.remove('hidden');
                    }
                }
            });
        }

        // --- CHAT SYSTEM ---
        window.openChat = (friendId, name, pfp) => {
            activeChatFriendId = friendId;
            // Reset notif
            set(ref(db, `notifications/${myData.uid}/${friendId}`), 0);
            document.getElementById(`notif-${friendId}`)?.classList.add('hidden');

            const container = document.getElementById('view-content');
            const header = document.getElementById('chat-header');
            
            header.innerHTML = `<div class="flex items-center gap-2"><span class="text-[#949ba4] text-xl">@</span><span class="font-bold text-white">${name}</span></div>`;
            
            container.innerHTML = `
                <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4 flex flex-col-reverse"></div>
                <div class="p-4"><input type="text" id="msg-input" placeholder="Envoyer un message à @${name}" class="chat-input"></div>
            `;

            const chatId = myData.uid < friendId ? `${myData.uid}_${friendId}` : `${friendId}_${myData.uid}`;
            
            onValue(ref(db, `chats/${chatId}`), (snap) => {
                const msgs = snap.val() || {};
                const msgBox = document.getElementById('chat-messages');
                msgBox.innerHTML = "";
                
                Object.values(msgs).sort((a,b) => b.time - a.time).forEach(m => {
                    const isMe = m.sender === myData.uid;
                    msgBox.innerHTML += `
                        <div class="flex items-start gap-4 msg-anim">
                            <img src="${isMe ? myData.pfp : pfp}" class="w-10 h-10 rounded-full mt-1">
                            <div>
                                <div class="flex items-center gap-2">
                                    <span class="font-bold text-sm text-white">${isMe ? myData.pseudo : name}</span>
                                    <span class="text-[10px] text-[#949ba4]">${new Date(m.time).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
                                </div>
                                <p class="text-sm text-[#dbdee1]">${m.text}</p>
                            </div>
                        </div>
                    `;
                });
            });

            document.getElementById('msg-input').onkeydown = (e) => {
                if(e.key === 'Enter' && e.target.value.trim() !== "") {
                    const text = e.target.value;
                    e.target.value = "";
                    const newMsgRef = push(ref(db, `chats/${chatId}`));
                    set(newMsgRef, { sender: myData.uid, text, time: serverTimestamp() });
                    
                    // Increment notif for friend
                    const notifRef = ref(db, `notifications/${friendId}/${myData.uid}`);
                    onValue(notifRef, (s) => {
                        const current = s.val() || 0;
                        update(ref(db, `notifications/${friendId}`), { [myData.uid]: current + 1 });
                    }, { onlyOnce: true });
                }
            };
        };

        window.logout = () => signOut(auth).then(() => window.location.href='login.html');
        window.changeTab = (tab) => location.reload(); // Pour revenir à la vue liste
    </script>
</body>
</html>
