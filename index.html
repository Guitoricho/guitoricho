<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RL Trade Pro | Marché d'échange</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="nav-container">
            <div class="logo">RL<span>TRADE</span></div>
            <button id="newPostBtn" class="main-btn">+ NOUVELLE OFFRE</button>
        </div>
    </header>

    <main class="container">
        <h2 class="section-title">Offres Récentes</h2>
        <div id="tradeFeed">
            </div>
    </main>

    <div id="postModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Créer une offre</h2>
                <span id="closeBtn" class="close">&times;</span>
            </div>
            <form id="tradeForm">
                <label>Titre de l'échange</label>
                <input type="text" id="title" placeholder="Ex: [H] Fennec [W] 500 Credits" required>

                <div class="form-row">
                    <div class="input-group">
                        <label>Année du compte</label>
                        <input type="number" id="year" value="2026" min="2015" max="2026">
                    </div>
                    <div class="input-group">
                        <label>Rang actuel</label>
                        <select id="rankSelect">
                            <option value="Bronze" data-icon="https://i.imgur.com/vHqQ8r6.png">Bronze</option>
                            <option value="Argent" data-icon="https://i.imgur.com/O6Sj9rF.png">Argent</option>
                            <option value="Or" data-icon="https://i.imgur.com/p0Xf01Z.png">Or</option>
                            <option value="Platine" data-icon="https://i.imgur.com/u74j7M0.png">Platine</option>
                            <option value="Diamant" data-icon="https://i.imgur.com/U8I2Z9v.png">Diamant</option>
                            <option value="Champion" data-icon="https://i.imgur.com/vN5N6V5.png">Champion</option>
                            <option value="Grand Champion" data-icon="https://i.imgur.com/Xw0GkGz.png">Grand Champion</option>
                            <option value="SSL" data-icon="https://i.imgur.com/T09zK7N.png">Supersonic Legend</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="publish-btn">PUBLIER L'OFFRE</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
