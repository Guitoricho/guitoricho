<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexCord | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --d-gray: #313338; --d-black: #111214; --d-sidebar: #2b2d31; --d-user: #232428; --d-blue: #5865f2; }
        body { background-color: var(--d-black); color: #dbdee1; font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; margin: 0; }
        
        .status-dot { width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--d-user); position: absolute; bottom: -2px; right: -2px; }
        .online { background: #23a55a; }
        .offline { background: #80848e; }
        
        .nav-btn { @apply px-4 py-1.5 rounded-md text-sm font-semibold transition-all cursor-pointer; }
        .nav-active { @apply bg-[#404249] text-white; }
        .nav-inactive { @apply text-[#b5bac1] hover:bg-[#35373c] hover:text-[#dbdee1]; }

        .settings-item { @apply flex items-center justify-between px-3 py-2 rounded-md text-[#b5bac1] hover:bg-[#3f4147] hover:text-[#dbdee1] cursor-pointer mb-1 transition-all; }
        .settings-active { @apply bg-[#4f545c]/40 text-white !important; }

        @keyframes pop { from { transform: scale(0.98); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .animate-pop { animation: pop 0.15s ease-out forwards; }
    </style>
</head>
<body class="flex h-screen w-screen select-none">

    <nav class="w-[72px] bg-black flex flex-col items-center py-3 gap-2 border-r border-white/5">
        <div onclick="location.reload()" class="w-12 h-12 bg-blue-600 rounded-[15px] flex items-center justify-center text-white cursor-pointer hover:rounded-[12px] transition-all shadow-lg">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3L4 9v12h5v-7h6v7h5V9z"/></svg>
        </div>
    </nav>

    <aside class="w-60 bg-[#2b2d31] flex flex-col">
        <div class="h-12 flex items-center px-3 border-b border-black/20 shadow-sm">
            <div class="w-full bg-[#1e1f22] text-[11px] text-[#949ba4] px-2 py-1.5 rounded font-medium">Rechercher...</div>
        </div>
        
        <div class="flex-1 p-2 space-y-1 overflow-y-auto" id="friends-list-sidebar">
            <p class="text-[10px] font-black text-[#949ba4] uppercase px-2 mt-4 mb-2 tracking-widest">Messages privés</p>
        </div>

        <div class="p-1.5 bg-[#232428] flex items-center gap-1">
            <div onclick="openSettings('profile')" class="flex items-center gap-2 p-1.5 hover:bg-[#35373c] rounded-md cursor-pointer flex-1 min-w-0 transition-all">
                <div class="relative min-w-[32px]">
                    <img id="my-pfp" class="w-8 h-8 rounded-full object-cover bg-zinc-800">
                    <div class="status-dot online"></div>
                </div>
                <div class="truncate">
                    <p id="my-name" class="text-[11px] font-bold text-white truncate">Chargement...</p>
                    <p class="text-[9px] text-[#b5bac1] font-bold uppercase tracking-tighter">En ligne</p>
                </div>
            </div>
            <div class="flex items-center text-[#b5bac1]">
                <button class="p-2 hover:bg-[#35373c] rounded-md"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg></button>
                <button onclick="openSettings('account')" class="p-2 hover:bg-[#35373c] rounded-md"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></button>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col bg-[#313338]">
        <header class="h-12 border-b border-black/20 flex items-center px-4 bg-[#313338] shadow-sm justify-between">
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 pr-4 border-r border-white/5 text-[#949ba4]">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    <span class="font-bold text-white text-sm">Amis</span>
                </div>
                <div class="flex gap-2">
                    <button onclick="changeTab('online')" id="tab-online" class="nav-btn nav-active">En ligne</button>
                    <button onclick="changeTab('pending')" id="tab-pending" class="nav-btn nav-inactive relative">En attente <span id="badge-p" class="hidden absolute -top-1 -right-2 bg-red-500 text-[10px] px-1 rounded-full border-2 border-[#313338]">0</span></button>
                    <button onclick="changeTab('add')" id="tab-add" class="nav-btn bg-[#248046] text-white hover:bg-[#1a6334]">Ajouter</button>
                </div>
            </div>
        </header>
        <div id="view-content" class="flex-1 p-6 overflow-y-auto"></div>
    </main>

    <div id="settings-layer" class="fixed inset-0 z-[100] bg-[#313338] hidden flex animate-pop">
        <aside class="w-[35%] bg-[#2b2d31] flex justify-end pr-8 pt-16">
            <div class="w-48">
                <p class="text-[11px] font-black text-[#949ba4] uppercase px-3 mb-2 tracking-widest">Paramètres</p>
                <div onclick="tabSet('account')" id="t-account" class="settings-item settings-active"><span>Mon compte</span></div>
                <div onclick="tabSet('profile')" id="t-profile" class="settings-item"><span>Profil</span></div>
                <div class="h-[1px] bg-white/5 my-2 mx-3"></div>
                <div onclick="logoutUser()" class="settings-item text-red-500 hover:bg-red-500/10"><span>Déconnexion</span></div>
            </div>
        </aside>
        <main class="flex-1 pt-16 px-12 relative overflow-y-auto">
            <div id="set-content" class="max-w-2xl"></div>
            <div onclick="closeSettings()" class="fixed top-14 right-20 flex flex-col items-center gap-1 cursor-pointer">
                <div class="w-9 h-9 border-2 border-[#b5bac1] rounded-full flex items-center justify-center text-[#b5bac1] hover:text-white hover:border-white">✕</div>
                <span class="text-[10px] font-bold text-[#b5bac1]">ESC</span>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, onValue, set, update, push, remove, onDisconnect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDZUfpKI7Cby-H0Qy2046Ez3VP7MjS6qOE",
            authDomain: "jaster-8fdd4.firebaseapp.com",
            databaseURL: "https://jaster-8fdd4-default-rtdb.firebaseio.com",
            projectId: "jaster-8fdd4",
            storageBucket: "jaster-8fdd4.firebasestorage.app",
            messagingSenderId: "1074590705898",
            appId: "1:1074590705898:web:df5c533cdd011d074c8f93"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let myData = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                onValue(ref(db, `users_data/${user.uid}`), (snap) => {
                    myData = snap.val() || {};
                    myData.uid = user.uid;
                    document.getElementById('my-name').innerText = myData.pseudo || "Utilisateur";
                    document.getElementById('my-pfp').src = myData.pfp || "https://ui-avatars.com/api/?background=random";
                    syncFriends();
                });
                set(ref(db, `online_users/${user.uid}`), true);
                onDisconnect(ref(db, `online_users/${user.uid}`)).remove();
                changeTab('online');
            } else {
                window.location.href = 'login.html';
            }
        });

        window.changeTab = (tab) => {
            const v = document.getElementById('view-content');
            ['online', 'pending', 'add'].forEach(t => {
                document.getElementById(`tab-${t}`).className = t === tab ? "nav-btn nav-active" : (t==='add' ? "nav-btn bg-[#248046] text-white" : "nav-btn nav-inactive");
            });

            if (tab === 'add') {
                v.innerHTML = `<div class="max-w-md animate-pop">
                    <h2 class="text-white font-bold uppercase text-xs mb-2">Ajouter un ami</h2>
                    <div class="bg-[#1e1f22] p-2 rounded-lg flex items-center gap-2 border border-black/40">
                        <input id="in-target" type="text" placeholder="Nom d'utilisateur" class="flex-1 bg-transparent outline-none text-sm px-2 text-white">
                        <button onclick="sendReq()" class="bg-[#5865f2] px-5 py-2 rounded text-xs font-bold text-white">Envoyer</button>
                    </div>
                </div>`;
            } else if (tab === 'pending') {
                renderPending();
            } else {
                v.innerHTML = `<p class="text-center text-zinc-600 mt-20 italic">Aucun ami en ligne pour le moment.</p>`;
            }
        };

        window.sendReq = () => {
            const target = document.getElementById('in-target').value.trim();
            if(!target) return;
            push(ref(db, `pending_requests/${target}`), { from: myData.pseudo, pfp: myData.pfp, uid: myData.uid });
            alert("Demande envoyée !");
        };

        function renderPending() {
            onValue(ref(db, `pending_requests/${myData.pseudo}`), (snap) => {
                const reqs = snap.val();
                const v = document.getElementById('view-content');
                v.innerHTML = `<h2 class="text-[#b5bac1] text-xs font-bold uppercase mb-4">En attente</h2>`;
                if(!reqs) { v.innerHTML += `<p class="text-zinc-600 text-sm italic">Rien ici.</p>`; return; }
                for(let key in reqs) {
                    const r = reqs[key];
                    v.innerHTML += `<div class="flex items-center justify-between p-3 hover:bg-white/5 rounded-lg">
                        <div class="flex items-center gap-3"><img src="${r.pfp}" class="w-10 h-10 rounded-full object-cover"><div><p class="text-white font-bold">${r.from}</p></div></div>
                        <div class="flex gap-2"><button onclick="accept('${key}','${r.uid}','${r.from}','${r.pfp}')" class="bg-[#248046] p-2 rounded-full">✓</button></div>
                    </div>`;
                }
            });
        }

        window.accept = async (key, uid, name, pfp) => {
            await update(ref(db, `friends/${myData.uid}/${uid}`), { name, pfp });
            await update(ref(db, `friends/${uid}/${myData.uid}`), { name: myData.pseudo, pfp: myData.pfp });
            await remove(ref(db, `pending_requests/${myData.pseudo}/${key}`));
        };

        function syncFriends() {
            onValue(ref(db, `friends/${myData.uid}`), (fSnap) => {
                const friends = fSnap.val() || {};
                onValue(ref(db, 'online_users'), (oSnap) => {
                    const online = oSnap.val() || {};
                    const side = document.getElementById('friends-list-sidebar');
                    side.innerHTML = `<p class="text-[10px] font-black text-[#949ba4] uppercase px-2 mt-4 mb-2 tracking-widest">Messages privés</p>`;
                    Object.keys(friends).forEach(id => {
                        const isOnline = online[id];
                        side.innerHTML += `<div class="flex items-center gap-3 p-2 rounded-md hover:bg-[#35373c] cursor-pointer group transition-all">
                            <div class="relative"><img src="${friends[id].pfp}" class="w-8 h-8 rounded-full object-cover ${!isOnline?'grayscale opacity-50':''}">
                            <div class="status-dot ${isOnline?'online':'offline'}"></div></div>
                            <p class="text-sm font-bold ${isOnline?'text-white':'text-zinc-500'}">${friends[id].name}</p>
                        </div>`;
                    });
                });
            });
        }

        window.openSettings = (t) => { document.getElementById('settings-layer').classList.remove('hidden'); tabSet(t); };
        window.closeSettings = () => document.getElementById('settings-layer').classList.add('hidden');
        
        window.tabSet = (tab) => {
            const v = document.getElementById('set-content');
            if(tab === 'profile') {
                v.innerHTML = `<h1 class="text-xl font-bold text-white mb-6">Profil</h1>
                <div class="bg-[#1e1f22] p-6 rounded-xl space-y-4">
                    <input type="file" id="up-p" class="hidden" onchange="window.handleP(this)">
                    <button onclick="document.getElementById('up-p').click()" class="bg-[#5865f2] px-4 py-2 rounded text-xs font-bold text-white">Changer l'image</button>
                    <textarea id="up-b" class="w-full bg-[#111214] rounded-lg p-3 text-sm h-24 outline-none">${myData.bio||''}</textarea>
                    <button onclick="saveP()" class="w-full bg-[#248046] py-2 rounded font-bold text-sm text-white">ENREGISTRER</button>
                </div>`;
            } else {
                v.innerHTML = `<h1 class="text-xl font-bold text-white mb-6">Mon compte</h1>
                <div class="bg-[#1e1f22] p-6 rounded-xl flex items-center gap-4">
                    <img src="${myData.pfp}" class="w-16 h-16 rounded-full object-cover">
                    <div><p class="font-bold text-lg">${myData.pseudo}</p><p class="text-zinc-500 text-sm">${auth.currentUser.email}</p></div>
                </div>`;
            }
        };

        window.handleP = (el) => {
            const r = new FileReader(); r.onload = (e) => myData.temp = e.target.result; r.readAsDataURL(el.files[0]);
        };

        window.saveP = async () => {
            const up = { bio: document.getElementById('up-b').value };
            if(myData.temp) up.pfp = myData.temp;
            await update(ref(db, `users_data/${myData.uid}`), up);
            alert("Sauvegardé !");
        };

        window.logoutUser = () => signOut(auth).then(() => window.location.href = 'login.html');
    </script>
</body>
</html>
