<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexCord | Connexion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #111214; background-image: url('https://discord.com/assets/ee7c382d92576551b5d3.svg'); background-size: cover; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card { background: #313338; padding: 32px; border-radius: 8px; width: 100%; max-width: 480px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); }
        input { background: #1e1f22 !important; border: none !important; color: #dbdee1 !important; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="card text-center">
        <h1 class="text-white text-2xl font-black italic mb-2">NexCord</h1>
        <p class="text-[#b5bac1] mb-8">Connecte-toi pour discuter !</p>
        <form id="f-login" class="text-left">
            <label class="block text-[11px] font-bold text-[#949ba4] uppercase mb-2">E-mail</label>
            <input type="email" id="email" required class="w-full p-3 rounded outline-none text-sm">
            <label class="block text-[11px] font-bold text-[#949ba4] uppercase mb-2">Mot de passe</label>
            <input type="password" id="pass" required class="w-full p-3 rounded outline-none text-sm">
            <button type="submit" class="w-full bg-[#5865f2] py-3 rounded text-white font-bold text-sm hover:bg-[#4752c4] transition-all">Se connecter</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDZUfpKI7Cby-H0Qy2046Ez3VP7MjS6qOE",
            authDomain: "jaster-8fdd4.firebaseapp.com",
            databaseURL: "https://jaster-8fdd4-default-rtdb.firebaseio.com",
            projectId: "jaster-8fdd4",
            storageBucket: "jaster-8fdd4.firebasestorage.app",
            messagingSenderId: "1074590705898",
            appId: "1:1074590705898:web:df5c533cdd011d074c8f93"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => { if (user) window.location.href = 'index.html'; });

        document.getElementById('f-login').onsubmit = async (e) => {
            e.preventDefault();
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('pass').value);
            } catch (err) { alert("Erreur : " + err.message); }
        };
    </script>
</body>
</html>
