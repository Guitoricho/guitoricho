<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>NexCord | S'inscrire</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #111214; background-image: url('https://discord.com/assets/ee7c382d92576551b5d3.svg'); background-size: cover; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #313338; padding: 32px; border-radius: 8px; width: 100%; max-width: 480px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); }
        input { background: #1e1f22 !important; border: none !important; color: #dbdee1 !important; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h1 class="text-white text-2xl font-black text-center mb-2">Créer un compte</h1>
        <form id="f-register" class="mt-6">
            <label class="block text-[11px] font-bold text-[#949ba4] uppercase mb-2">E-mail</label>
            <input type="email" id="re-email" required class="w-full p-3 rounded outline-none text-sm">
            
            <label class="block text-[11px] font-bold text-[#949ba4] uppercase mb-2">Nom d'utilisateur (Pseudo)</label>
            <input type="text" id="re-pseudo" required class="w-full p-3 rounded outline-none text-sm">
            
            <label class="block text-[11px] font-bold text-[#949ba4] uppercase mb-2">Mot de passe</label>
            <input type="password" id="re-pass" required class="w-full p-3 rounded outline-none text-sm">
            
            <button type="submit" class="w-full bg-[#5865f2] py-3 rounded text-white font-bold text-sm hover:bg-[#4752c4] transition-all">Continuer</button>
            <p class="text-[13px] text-[#00a8fc] mt-4 cursor-pointer hover:underline" onclick="window.location.href='login.html'">Tu as déjà un compte ?</p>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDZUfpKI7Cby-H0Qy2046Ez3VP7MjS6qOE",
            authDomain: "jaster-8fdd4.firebaseapp.com",
            databaseURL: "https://jaster-8fdd4-default-rtdb.firebaseio.com",
            projectId: "jaster-8fdd4",
            storageBucket: "jaster-8fdd4.firebasestorage.app",
            messagingSenderId: "1074590705898",
            appId: "1:1074590705898:web:df5c533cdd011d074c8f93"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        document.getElementById('f-register').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('re-email').value;
            const pseudo = document.getElementById('re-pseudo').value;
            const pass = document.getElementById('re-pass').value;

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
                const user = userCredential.user;
                
                // Créer le profil dans la DB
                await set(ref(db, 'users_data/' + user.uid), {
                    pseudo: pseudo,
                    pfp: "https://ui-avatars.com/api/?name=" + pseudo + "&background=random",
                    bio: "Nouveau sur NexCord !",
                    email: email
                });

                window.location.href = 'index.html';
            } catch (err) { alert(err.message); }
        };
    </script>
</body>
</html>
