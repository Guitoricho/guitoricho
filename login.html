<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexCord | Bienvenue</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --d-blue: #5865f2; --d-black: #111214; --d-gray: #313338; }
        body {
            background-image: url('https://discord.com/assets/ee7c382d92576551b5d3.svg');
            background-size: cover;
            background-position: center;
            background-color: var(--d-black);
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .auth-card {
            background: #313338;
            padding: 32px;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 480px;
            transition: all 0.3s ease;
        }
        input {
            background-color: #1e1f22 !important;
            border: none !important;
            color: #dbdee1 !important;
            transition: all 0.2s;
        }
        input:focus { box-shadow: 0 0 0 2px var(--d-blue) !important; }
        .btn-primary { background-color: var(--d-blue); transition: background-color 0.2s; }
        .btn-primary:hover { background-color: #4752c4; }
        .hidden-form { display: none; }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="text-center mb-8">
            <h1 class="text-white text-3xl font-black italic tracking-tighter">NexCord</h1>
            <p id="auth-subtitle" class="text-[#b5bac1] text-sm mt-2">Ravi de vous revoir !</p>
        </div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-[11px] font-bold text-[#949ba4] uppercase mb-2">E-mail</label>
                <input type="email" id="login-email" required class="w-full p-3 rounded-md outline-none text-sm">
            </div>
            <div>
                <label class="block text-[11px] font-bold text-[#949ba4] uppercase mb-2">Mot de passe</label>
                <input type="password" id="login-pass" required class="w-full p-3 rounded-md outline-none text-sm">
            </div>
            <button type="submit" class="w-full btn-primary py-3 rounded-md text-white font-bold text-sm mt-2">Se connecter</button>
            <p class="text-sm text-[#949ba4]">
                Besoin d'un compte ? 
                <button type="button" onclick="toggleAuth('register')" class="text-[#00a8fc] hover:underline">S'inscrire</button>
            </p>
        </form>

        <form id="register-form" class="space-y-4 hidden-form">
            <div>
                <label class="block text-[11px] font-bold text-[#949ba4] uppercase mb-2">E-mail</label>
                <input type="email" id="reg-email" required class="w-full p-3 rounded-md outline-none text-sm">
            </div>
            <div>
                <label class="block text-[11px] font-bold text-[#949ba4] uppercase mb-2">Nom d'utilisateur</label>
                <input type="text" id="reg-pseudo" required class="w-full p-3 rounded-md outline-none text-sm">
            </div>
            <div>
                <label class="block text-[11px] font-bold text-[#949ba4] uppercase mb-2">Mot de passe</label>
                <input type="password" id="reg-pass" required class="w-full p-3 rounded-md outline-none text-sm">
            </div>
            <button type="submit" class="w-full btn-primary py-3 rounded-md text-white font-bold text-sm mt-2">Créer mon compte</button>
            <p class="text-sm text-[#949ba4]">
                Déjà un compte ? 
                <button type="button" onclick="toggleAuth('login')" class="text-[#00a8fc] hover:underline">Se connecter</button>
            </p>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDZUfpKI7Cby-H0Qy2046Ez3VP7MjS6qOE",
            authDomain: "jaster-8fdd4.firebaseapp.com",
            databaseURL: "https://jaster-8fdd4-default-rtdb.firebaseio.com",
            projectId: "jaster-8fdd4",
            storageBucket: "jaster-8fdd4.firebasestorage.app",
            messagingSenderId: "1074590705898",
            appId: "1:1074590705898:web:df5c533cdd011d074c8f93"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // Basculer entre Connexion et Inscription
        window.toggleAuth = (mode) => {
            const loginForm = document.getElementById('login-form');
            const regForm = document.getElementById('register-form');
            const subtitle = document.getElementById('auth-subtitle');

            if (mode === 'register') {
                loginForm.classList.add('hidden-form');
                regForm.classList.remove('hidden-form');
                subtitle.innerText = "Créez votre profil en quelques secondes.";
            } else {
                regForm.classList.add('hidden-form');
                loginForm.classList.remove('hidden-form');
                subtitle.innerText = "Ravi de vous revoir !";
            }
        };

        // Redirection si déjà connecté
        onAuthStateChanged(auth, (user) => {
            if (user) window.location.href = 'index.html';
        });

        // LOGIQUE CONNEXION
        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (err) { alert("Erreur : Compte introuvable ou mot de passe incorrect."); }
        };

        // LOGIQUE INSCRIPTION
        document.getElementById('register-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('reg-email').value;
            const pseudo = document.getElementById('reg-pseudo').value;
            const pass = document.getElementById('reg-pass').value;

            try {
                const res = await createUserWithEmailAndPassword(auth, email, pass);
                // Création immédiate du profil dans la base de données
                await set(ref(db, `users_data/${res.user.uid}`), {
                    pseudo: pseudo,
                    email: email,
                    pfp: `https://ui-avatars.com/api/?name=${pseudo}&background=random`,
                    bio: "Nouveau membre NexCord !"
                });
            } catch (err) { alert("Erreur lors de l'inscription : " + err.message); }
        };
    </script>
</body>
</html>
